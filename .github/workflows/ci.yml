name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do CI só lê o repositório
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatação (gofmt)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Código do sqlc em dia com o SQL
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff
      - run: go vet ./...
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Testes do JavaScript da interface (node --test, sem dependências)
        run: node --test 'internal/web/testes/*.test.js'
        env:
          TZ: America/Sao_Paulo
      - name: Testes (Testcontainers sobe o Postgres; -race procura condições de corrida)
        run: go test -race -count=1 ./...

  imagem:
    # Confere que a imagem de produção monta (a VM é x86, como o runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg COMMIT=${{ github.sha }} -t pursuit:ci .
      - name: O binário da imagem roda
        run: docker run --rm pursuit:ci nada 2>&1 | grep -q "Uso:"
