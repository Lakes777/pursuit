# Produção na VM ARM da Oracle, a mesma do Beacon. O Pursuit usa o Postgres do Beacon (com banco e
# usuário próprios) e o Caddy dele na frente: por isso entra na rede interna do Beacon, em vez de
# subir outro Postgres e outro Caddy.
name: pursuit

services:
  api:
    image: pursuit:latest
    restart: unless-stopped
    # PURSUIT_BANCO_URL, PURSUIT_TELEGRAM_TOKEN, PURSUIT_TELEGRAM_CHAT e PURSUIT_PROXY_CONFIAVEL
    # e PURSUIT_BEACON_URL/_CHAVE ficam no .env da VM (criado pelo preparar-vm.sh) e nunca saem de lá
    env_file: .env
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      beacon:
        # O nome que o Caddy do Beacon usa para chegar aqui (reverse_proxy pursuit:8095)
        aliases: [pursuit]

networks:
  beacon:
    external: true
    name: beacon_interna
