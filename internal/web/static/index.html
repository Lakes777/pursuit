<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pursuit</title>
  <meta name="description" content="Pursuit: acompanhamento das minhas candidaturas a vagas.">
  <meta name="theme-color" content="#0c1517">
  <link rel="icon" href="img/pursuit.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/pursuit.css">
  <link rel="stylesheet" href="css/quadro.css">
  <link rel="stylesheet" href="css/numeros.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Ícones de uma cor só (desenhados no estilo do Lucide, licença ISC). Uso: <svg><use href="#i-nome"/></svg> -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 7.5c0-.8.7-1.5 1.5-1.5H9l2 2h8.5c.8 0 1.5.7 1.5 1.5v8.5c0 .8-.7 1.5-1.5 1.5h-15C3.7 19.5 3 18.8 3 18z" fill="#132126" stroke="#3fb0a0" stroke-width="1.6"/><rect x="7" y="3.5" width="10" height="7" rx="1" fill="#b7e4dc"/><path d="M9 6h6M9 8h4" stroke="#0c1517" stroke-width="1.2"/></symbol>
    <symbol id="i-mais" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-sair" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-relogio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-lapis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></symbol>
    <symbol id="i-lixeira" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-voltar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-busca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  </svg>

  <p class="carregando" id="carregando">Carregando…</p>

  <main class="entrada" id="entrada" hidden>
    <form class="cartao-entrada" id="form-entrada" novalidate>
      <svg class="logo-grande" aria-hidden="true"><use href="#i-logo"/></svg>
      <h1>Pursuit</h1>
      <p class="sub">Entre para ver as suas candidaturas.</p>
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <p class="erro" id="erro-entrada" role="alert" hidden></p>
      <button type="submit" class="botao principal">Entrar</button>
    </form>
  </main>

  <div class="app" id="app" hidden>
    <header class="barra">
      <a class="marca" href="#/quadro"><svg aria-hidden="true"><use href="#i-logo"/></svg>Pursuit</a>
      <nav class="menu" aria-label="Seções">
        <a href="#/quadro" data-secao="quadro">Quadro</a>
        <a href="#/numeros" data-secao="numeros">Números</a>
        <a href="#/lembretes" data-secao="lembretes">Lembretes</a>
      </nav>
      <div class="acoes-barra">
        <a class="botao principal" href="#/nova"><svg aria-hidden="true"><use href="#i-mais"/></svg>Nova candidatura</a>
        <button class="botao fantasma" id="sair" type="button" title="Sair"><svg aria-hidden="true"><use href="#i-sair"/></svg><span class="so-leitor">Sair</span></button>
      </div>
    </header>
    <section class="numeros-topo" id="numeros-topo" aria-label="Resumo"></section>
    <main class="conteudo" id="conteudo" tabindex="-1"></main>
  </div>

  <div class="avisos" id="avisos" role="status" aria-live="polite"></div>
</body>
</html>
